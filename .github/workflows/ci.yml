name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The nix-secrets flake input is fetched over SSH. Create a read-only
      # deploy key on lukasfriedhoff/nix-secrets and store its private half
      # as the NIX_SECRETS_DEPLOY_KEY repository secret.
      - name: Set up SSH for the nix-secrets input
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.NIX_SECRETS_DEPLOY_KEY }}

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          install_url: https://releases.nixos.org/nix/nix-2.29.2/install
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Format check
        run: nix fmt -- --ci .

      # Evaluate every host in its own nix process: one shared process (as
      # nix flake check does) accumulates the heap of all 19 systems and
      # gets OOM-killed on hosted runners. Eval failures are what break
      # comin deploys, and this catches those per host.
      - name: Evaluate hosts
        run: |
          set -euo pipefail
          hosts=$(nix eval --json .#nixosConfigurations --apply builtins.attrNames | jq -r '.[]')
          for h in $hosts; do
            echo "::group::nixosConfigurations.$h"
            nix eval --raw ".#nixosConfigurations.\"$h\".config.system.build.toplevel.drvPath"
            echo
            echo "::endgroup::"
          done
          echo "::group::darwinConfigurations.macbook-pro"
          nix eval --raw ".#darwinConfigurations.macbook-pro.system.drvPath"
          echo
          echo "::endgroup::"

  # comin on the servers tracks the `deploy` branch. Fast-forward it only
  # after checks pass, so a broken eval on develop can never reach a host.
  #
  # workflow_dispatch is accepted because push/pull_request events do not
  # create workflow runs on this repository (GitHub-side issue; only manual
  # dispatch works). After pushing develop, trigger the gate with:
  #   gh workflow run CI --ref develop
  promote:
    needs: checks
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward deploy branch
        run: |
          git push origin HEAD:refs/heads/deploy
