# BREAK-GLASS CI. The primary gate is .forgejo/workflows/ci.yml, which runs on
# the in-cluster Forgejo runner and fires automatically on push.
#
# This twin exists for one failure mode: the cluster that hosts that runner is
# itself broken, so the only way to get a fix onto the fleet is a gate that
# lives outside the blast radius. GitHub's hosted runners do.
#
# Deliberately workflow_dispatch ONLY. Leaving push/pull_request on would race
# the Forgejo gate for the `deploy` branch and double the spend on every commit,
# and it would not fire anyway - push events do not create workflow runs on a
# repo that is a push mirror. Invoke it by hand when you need it:
#   gh workflow run CI --ref develop
#
# Keep the checks here in step with the Forgejo workflow.
name: CI

on:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The nix-secrets flake input is fetched over SSH. Create a read-only
      # deploy key on lukasfriedhoff/nix-secrets and store its private half
      # as the NIX_SECRETS_DEPLOY_KEY repository secret.
      - name: Set up SSH for the nix-secrets input
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.NIX_SECRETS_DEPLOY_KEY }}

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          install_url: https://releases.nixos.org/nix/nix-2.29.2/install
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Format check
        run: nix fmt -- --ci .

      # Evaluate every host in its own nix process: one shared process (as
      # nix flake check does) accumulates the heap of all 19 systems and
      # gets OOM-killed on hosted runners. Eval failures are what break
      # comin deploys, and this catches those per host.
      - name: Evaluate hosts
        run: |
          set -euo pipefail
          hosts=$(nix eval --json .#nixosConfigurations --apply builtins.attrNames | jq -r '.[]')
          for h in $hosts; do
            echo "::group::nixosConfigurations.$h"
            nix eval --raw ".#nixosConfigurations.\"$h\".config.system.build.toplevel.drvPath"
            echo
            echo "::endgroup::"
          done
          darwins=$(nix eval --json .#darwinConfigurations --apply builtins.attrNames | jq -r '.[]')
          for h in $darwins; do
            echo "::group::darwinConfigurations.$h"
            nix eval --raw ".#darwinConfigurations.\"$h\".system.drvPath"
            echo
            echo "::endgroup::"
          done

  # comin on the servers tracks the `deploy` branch. Fast-forward it only
  # after checks pass, so a broken eval on develop can never reach a host.
  promote:
    needs: checks
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Forgejo (git.h4xx.io) is the primary; this GitHub repo is a push
      # mirror that force-syncs ALL refs from Forgejo. Pushing deploy here
      # would be clobbered on the next mirror sync, so promote on Forgejo and
      # let the mirrors propagate it. comin reads deploy from the Codeberg
      # mirror first and falls back to this one - see
      # modules/features/comin/nixos.nix. FORGEJO_TOKEN is a repo Actions
      # secret (Forgejo PAT, write:repository).
      # The runner checks out the GitHub MIRROR, which can lag Forgejo by a
      # few seconds (sync_on_commit) - pushing that stale HEAD used to lose a
      # non-fast-forward race. Fetch Forgejo's develop and promote THAT.
      - name: Fast-forward deploy branch (on Forgejo, the primary)
        run: |
          git fetch "https://ci:${{ secrets.FORGEJO_TOKEN }}@git.h4xx.io/lukasf/nix.git" develop
          git push "https://ci:${{ secrets.FORGEJO_TOKEN }}@git.h4xx.io/lukasf/nix.git" FETCH_HEAD:refs/heads/deploy
